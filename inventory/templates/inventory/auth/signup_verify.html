<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - StockFlow IMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 bg-white border rounded-3xl shadow-xl">
        <div class="flex flex-col items-center gap-3 mb-8 text-center">
            <div class="h-12 w-12 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-2xl shadow-lg">
                <i class="fa-solid fa-envelope-circle-check"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Verify Email</h1>
                <p class="text-sm text-slate-400 mt-1">We sent a 6-digit code to <span class="font-semibold text-slate-600">{{ email }}</span></p>
            </div>
        </div>
        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="p-3.5 text-sm rounded-xl font-medium flex items-start gap-2.5 border {% if message.tags == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-800{% else %}bg-rose-50 border-rose-200 text-rose-800{% endif %}">
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">6-digit OTP</label>
                <input type="text" name="otp" required maxlength="6" inputmode="numeric" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-center text-lg tracking-[0.5em] font-bold outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600" placeholder="123456">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm">Verify & Activate</button>
        </form>
        <form method="POST" class="mt-3">
            {% csrf_token %}
            <input type="hidden" name="resend" value="1">
            <button type="submit" class="w-full py-2.5 border border-gray-200 rounded-xl text-sm font-semibold text-gray-600 hover:bg-gray-50">Resend code</button>
        </form>
        <div class="mt-6 text-center pt-6 border-t border-slate-100">
            <a href="{% url 'inventory:signup' %}" class="text-sm font-bold text-indigo-600">Back to signup</a>
        </div>
    </div>
</body>
</html>
