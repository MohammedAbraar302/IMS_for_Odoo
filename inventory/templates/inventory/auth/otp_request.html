<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - StockFlow IMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 bg-white border border-gray-150 rounded-3xl shadow-xl shadow-slate-100">
        <!-- Logo -->
        <div class="flex flex-col items-center gap-3 mb-8 text-center">
            <div class="h-12 w-12 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-indigo-600/20">
                <i class="fa-solid fa-key"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Reset Password</h1>
                <p class="text-sm text-slate-400 mt-1">We'll generate a verification OTP to reset your password</p>
            </div>
        </div>

        <!-- Flash messages -->
        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="p-3.5 text-sm rounded-xl font-medium flex items-start gap-2.5 border {% if message.tags == 'success' %}bg-emerald-50 border-emerald-150 text-emerald-800{% else %}bg-rose-50 border-rose-150 text-rose-800{% endif %}">
                        <i class="fa-solid {% if message.tags == 'success' %}fa-circle-check{% else %}fa-circle-exmark{% endif %} mt-0.5"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <input type="hidden" name="step" value="1">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Registered Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" name="email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all outline-none" placeholder="you@domain.com">
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/15 hover:shadow-xl hover:shadow-indigo-600/25 transition-all text-sm mt-2">
                Request OTP Code
            </button>
        </form>

        <div class="mt-8 text-center pt-6 border-t border-slate-100">
            <a href="{% url 'inventory:login' %}" class="text-sm font-bold text-indigo-600 hover:text-indigo-800 transition-colors">Back to Login</a>
        </div>
    </div>
</body>
</html>
