{% extends 'inventory/base.html' %}

{% block title %}Create Receipt - StockFlow IMS{% endblock %}
{% block header_title %}New Receipt{% endblock %}

{% block content %}
<div class="max-w-xl bg-white rounded-2xl border border-gray-150 shadow-sm overflow-hidden">
    <div class="p-6 border-b border-gray-150 bg-slate-50/50">
        <h3 class="text-base font-bold text-slate-900">Receipt Details</h3>
        <p class="text-xs text-slate-500 mt-0.5">Start a new draft receipt for goods arriving from a supplier</p>
    </div>

    <form method="POST" class="p-6 space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Supplier / Vendor Name</label>
            <input type="text" name="supplier" required class="w-full bg-slate-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all outline-none" placeholder="e.g., Apex Steel Ltd.">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Notes</label>
            <textarea name="notes" rows="3" class="w-full bg-slate-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all outline-none" placeholder="Add optional reference details (e.g., PO #, delivery truck ID)..."></textarea>
        </div>

        <div class="pt-4 border-t border-gray-150 flex justify-end gap-3">
            <a href="{% url 'inventory:receipt_list' %}" class="px-5 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold text-gray-600 hover:bg-gray-50 transition-colors">
                Cancel
            </a>
            <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md shadow-indigo-600/15 hover:shadow-lg transition-all text-sm">
                Create Draft Receipt
            </button>
        </div>
    </form>
</div>
{% endblock %}
