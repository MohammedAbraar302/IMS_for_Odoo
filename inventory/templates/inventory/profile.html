{% extends 'inventory/base.html' %}

{% block title %}My Profile - StockFlow IMS{% endblock %}
{% block header_title %}My Profile{% endblock %}

{% block content %}
<div class="max-w-2xl bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
        <h3 class="text-base font-bold text-gray-950">Profile Information</h3>
        <p class="text-xs text-gray-500 mt-0.5">Manage your personal details and system credentials</p>
    </div>
    
    <form method="POST" class="p-6 space-y-5">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">First Name</label>
                <input type="text" name="first_name" value="{{ user.first_name }}" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Last Name</label>
                <input type="text" name="last_name" value="{{ user.last_name }}" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all outline-none">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Username (Read-only)</label>
            <input type="text" readonly value="{{ user.username }}" class="w-full bg-gray-100 border border-gray-200 text-gray-500 rounded-xl px-4 py-2.5 text-sm font-medium outline-none">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Email Address</label>
            <input type="email" name="email" value="{{ user.email }}" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all outline-none">
        </div>

        <div class="pt-4 border-t border-gray-100 flex justify-end">
            <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md shadow-indigo-600/15 hover:shadow-lg transition-all text-sm">
                Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
