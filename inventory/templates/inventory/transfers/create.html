{% extends 'inventory/base.html' %}

{% block title %}Create Transfer - StockFlow IMS{% endblock %}
{% block header_title %}New Internal Transfer{% endblock %}

{% block content %}
<div class="max-w-xl bg-white rounded-2xl border border-gray-150 shadow-sm overflow-hidden">
    <div class="p-6 border-b border-gray-150 bg-slate-50/50">
        <h3 class="text-base font-bold text-slate-900">Transfer Details</h3>
        <p class="text-xs text-slate-500 mt-0.5">Move stock between locations within your organization</p>
    </div>

    <form method="POST" class="p-6 space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">From Location</label>
            <select name="from_location" required class="w-full bg-slate-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all outline-none">
                <option value="">-- Select Source Warehouse/Location --</option>
                {% for loc in locations %}
                    <option value="{{ loc.id }}">{{ loc.warehouse.name }} - {{ loc.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">To Location</label>
            <select name="to_location" required class="w-full bg-slate-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all outline-none">
                <option value="">-- Select Destination Warehouse/Location --</option>
                {% for loc in locations %}
                    {% if loc.id != from_loc_id %}
                        <option value="{{ loc.id }}">{{ loc.warehouse.name }} - {{ loc.name }}</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Select Product</label>
            <select name="product" required class="w-full bg-slate-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all outline-none">
                <option value="">-- Choose Product --</option>
                {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} ({{ p.sku }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Quantity</label>
                <input type="number" name="quantity" min="1" required class="w-full bg-slate-50 border border-gray-200 rounded-xl px-4 py-2 text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Notes (Optional)</label>
                <textarea name="notes" rows="3" class="w-full bg-slate-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all outline-none" placeholder="Add any special handling requirements..."></textarea>
            </div>
        </div>

        <div class="pt-4 border-t border-gray-150 flex justify-end gap-3">
            <a href="{% url 'inventory:transfer_list' %}" class="px-5 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold text-gray-600 hover:bg-gray-50 transition-colors">
                Cancel
            </a>
            <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md shadow-indigo-600/15 hover:shadow-lg transition-all text-sm">
                Schedule Transfer
            </button>
        </div>
    </form>
</div>
{% endblock %}
